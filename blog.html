<!DOCTYPE html>
<html lang="en" data-theme="amber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blogs — Isara Perera</title>
<meta name="description" content="Articles and notes by Isara Perera on enterprise software, Salesforce, integrations, cloud and AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/blog.css">
</head>
<body>

  <!-- SIDEBAR (shared component: js/components/sidebar.js) -->
  <div id="site-sidebar" data-page="blog"></div>
  <script src="js/components/sidebar.js"></script>

  <main>
    <!-- FLOATING SEARCH (opens js/components/search.js) -->
    <div class="blog-search-float">
      <button class="blog-search-btn" type="button" data-search-open aria-label="Search blogs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search blogs…</span><kbd>⌘K</kbd>
      </button>
    </div>

    <section id="blog" class="blog-page">

      <!-- LIST VIEW -->
      <div id="blogList">
        <p class="eyebrow">Blogs</p>
        <h1 class="title">Notes &amp; articles</h1>
        <p class="lead">Writing on enterprise software, integrations, cloud and AI — lessons from real projects.</p>
        <div class="blog-filters" id="blogFilters" role="group" aria-label="Filter posts by topic"></div>
        <div class="blog-grid" id="blogGrid"></div>
        <p class="blog-empty" id="blogEmpty" hidden>No posts yet — check back soon.</p>
      </div>

      <!-- SINGLE POST VIEW -->
      <article class="blog-post" id="blogPost" hidden>
        <a href="blog.html" class="blog-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          All posts
        </a>
        <p class="blog-meta" id="postMeta"></p>
        <h1 class="blog-post-title" id="postTitle"></h1>
        <div class="blog-tags" id="postTags"></div>
        <div class="blog-body" id="postBody"></div>
      </article>

    </section>
  </main>

<script src="js/blog-data.js"></script>
<script src="js/blog.js"></script>
<script src="js/components/search.js"></script>
<script src="js/main.js"></script>
<script src="js/analytics-config.js"></script>
<script src="js/tracker.js"></script>
<script src="js/components/message.js"></script>
</body>
</html>
